[project]
name = "tenten-rl"
version = "1.2.0"
description = "Reinforcement learning agents for the puzzle game 1010!, with exact explanations of the learned value function."
readme = "README.md"
authors = [
    { name = "CarlosMartinezCuenca", email = "carlos.martinez.cuenca04@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.17.1",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "pygame>=2.6.1",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tenten"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
